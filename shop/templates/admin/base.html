{% extends "base.html" %}
{% block body_class %}admin{% endblock %}
{% block navbar %}
<nav class="navbar navbar-expand-md admin-nav">
  <div class="container">
    <a class="navbar-brand brand text-white" href="{{ url_for('admin.products') }}">
      <span class="brand-mark"><i class="bi bi-speedometer2"></i></span>{{ shop_name }} <small class="opacity-75 fw-normal">Admin</small>
    </a>
    {% if session.is_admin %}
    <button class="navbar-toggler navbar-dark" type="button" data-bs-toggle="collapse" data-bs-target="#anav" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="anav">
      <ul class="navbar-nav me-auto ms-md-4">
        <li class="nav-item"><a class="nav-link {% if request.endpoint.startswith('admin.product') %}active{% endif %}" href="{{ url_for('admin.products') }}"><i class="bi bi-box-seam"></i> Products</a></li>
        <li class="nav-item"><a class="nav-link {% if request.endpoint.startswith('admin.order') %}active{% endif %}" href="{{ url_for('admin.orders') }}"><i class="bi bi-receipt"></i> Orders</a></li>
      </ul>
      <div class="d-flex gap-2 align-items-center">
        <a href="{{ url_for('public.index') }}" target="_blank" class="btn btn-sm btn-outline-light"><i class="bi bi-shop"></i> View store</a>
        <form method="post" action="{{ url_for('admin.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="btn btn-sm btn-light"><i class="bi bi-box-arrow-right"></i> Logout</button>
        </form>
      </div>
    </div>
    {% endif %}
  </div>
</nav>
{% endblock %}
{% block footer %}{% endblock %}
