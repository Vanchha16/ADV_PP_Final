{% extends "admin/base.html" %}
{% block title %}Admin login · {{ shop_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-9 col-md-6 col-lg-4">
    <form method="post" class="panel mt-md-5">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="text-center mb-4">
        <div class="success-icon admin-icon"><i class="bi bi-shield-lock"></i></div>
        <h1 class="h4 mb-0">Admin sign in</h1>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold" for="username">Username</label>
        <input class="form-control" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-brand w-100">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
