# One-click deploy on Render: New + > Blueprint > pick this repo.
services:
  - type: web
    name: anime-world-shop
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --preload --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: anime-world-shop-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: BAKONG_ACCOUNT_ID
        sync: false
      - key: BAKONG_TOKEN
        sync: false
      - key: BAKONG_API_URL
        value: https://api-bakong.nbc.gov.kh/v1
      - key: BAKONG_PROXY_KEY
        sync: false

databases:
  - name: anime-world-shop-db
    plan: free
